# Publishes the tawked package to PyPI when a version tag (v0.1.0, v0.2.0, ...) is pushed, by
# Trusted Publishing: PyPI trusts this workflow in the `pypi` environment, so no token is stored
# anywhere. It only builds and publishes; the checks run before the tag is made.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tawked
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: The tag names the package's version
        run: test "${GITHUB_REF_NAME#v}" = "$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
